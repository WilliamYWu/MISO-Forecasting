[project]
name = "miso-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "WilliamYWu", email = "billlife999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
miso-forecasting = "miso_forecasting:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
